<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="#1a1a2e"/>

  <!-- Network edges -->
  <!-- Center to top-left -->
  <line x1="64" y1="64" x2="28" y2="36" stroke="#4fc3f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Center to top-right -->
  <line x1="64" y1="64" x2="100" y2="36" stroke="#4fc3f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Center to bottom-left -->
  <line x1="64" y1="64" x2="28" y2="94" stroke="#4fc3f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Center to bottom-right -->
  <line x1="64" y1="64" x2="100" y2="94" stroke="#4fc3f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Top-left to top-right -->
  <line x1="28" y1="36" x2="100" y2="36" stroke="#4fc3f7" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Bottom-left to bottom-right -->
  <line x1="28" y1="94" x2="100" y2="94" stroke="#4fc3f7" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Center to top (extra) -->
  <line x1="64" y1="64" x2="64" y2="18" stroke="#81d4fa" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Peripheral nodes -->
  <circle cx="28" cy="36" r="9" fill="#0288d1" stroke="#4fc3f7" stroke-width="2"/>
  <circle cx="100" cy="36" r="9" fill="#0288d1" stroke="#4fc3f7" stroke-width="2"/>
  <circle cx="28" cy="94" r="9" fill="#0288d1" stroke="#4fc3f7" stroke-width="2"/>
  <circle cx="100" cy="94" r="9" fill="#0288d1" stroke="#4fc3f7" stroke-width="2"/>
  <circle cx="64" cy="18" r="7" fill="#01579b" stroke="#81d4fa" stroke-width="2"/>

  <!-- Central hub node -->
  <circle cx="64" cy="64" r="16" fill="#0277bd" stroke="#4fc3f7" stroke-width="3"/>
  <!-- Inner ring highlight -->
  <circle cx="64" cy="64" r="10" fill="none" stroke="#b3e5fc" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Letter N (for NetST) -->
  <text x="64" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        font-weight="bold" fill="#e1f5fe" letter-spacing="0">N</text>
</svg>
